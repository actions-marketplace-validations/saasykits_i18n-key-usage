name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Schema is up to date
        run: pnpm schema && git diff --exit-code schema.json

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: usage
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixtures/basic
          version: ${{ github.workspace }}
      - name: Fixture reports its unused and missing keys
        run: test "${{ steps.usage.outputs.exit-code }}" = "1"
      - id: inputs
        uses: ./
        continue-on-error: true
        with:
          working-directory: test/fixtures/no-config
          version: ${{ github.workspace }}
          messages: messages/en.json
          include: |
            src/**/*.{ts,tsx}
          retained: home.unused
      - name: Inputs work without a config file
        run: test "${{ steps.inputs.outputs.exit-code }}" = "1"
